<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EthioLearn - Grade 12 Physics</title>

<style>
* {
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  margin: 0;
  padding: 15px;
  min-height: 100vh;
  background: #eef6ff;
  display: flex;
  justify-content: center;
  align-items: center;
}

.quiz-card {
  width: 100%;
  max-width: 700px;
  background: white;
  padding: 25px;
  border-radius: 16px;
  box-shadow: 0 5px 20px #0002;
}

header {
  text-align: center;
  border-bottom: 2px solid #ddd;
  padding-bottom: 15px;
  margin-bottom: 20px;
}

h2 {
  color: #123b68;
  margin: 5px;
}

#progress {
  color: #1769aa;
  font-weight: bold;
}

.question {
  font-size: 1.15rem;
  line-height: 1.6;
  font-weight: bold;
  color: #263238;
  margin-bottom: 20px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.option {
  text-align: left;
  border: 2px solid #b8c9d9;
  background: #f8fbff;
  padding: 13px;
  border-radius: 9px;
  cursor: pointer;
  font-size: 1rem;
}

.option:hover:not(:disabled) {
  background: #e2f0ff;
  border-color: #1479c9;
}

.correct {
  background: #b9f6ca !important;
  border-color: #159447 !important;
  color: #075b23;
}

.wrong {
  background: #ffcdd2 !important;
  border-color: #d32f2f !important;
  color: #8b0000;
}

#feedback {
  margin-top: 18px;
  padding: 12px;
  border-radius: 8px;
  font-weight: bold;
  line-height: 1.5;
  display: none;
}

button.next,
button.restart {
  width: 100%;
  border: none;
  color: white;
  background: #1769aa;
  padding: 13px;
  border-radius: 8px;
  margin-top: 18px;
  cursor: pointer;
  font-size: 1rem;
  font-weight: bold;
}

button.next:hover,
button.restart:hover {
  background: #0d4775;
}

#result {
  display: none;
  text-align: center;
}

#result h2 {
  color: #159447;
}
</style>
</head>

<body>

<div class="quiz-card">

  <header>
    <h2>Grade 12 Physics Exam</h2>
    <p id="progress">Question 15 / 28</p>
  </header>

  <div id="quizBox">
    <div id="question" class="question"></div>
    <div id="options" class="options"></div>
    <div id="feedback"></div>
    <button class="next" id="nextButton" onclick="nextQuestion()">
      Next Question ➜
    </button>
  </div>

  <div id="result">
    <h2>🎉 Exam Completed!</h2>
    <p id="score"></p>
    <p id="percentage"></p>
    <button class="restart" onclick="restartQuiz()">Restart Quiz 🔄</button>
  </div>

</div>

<script>
const questions = [
  {
    number: 15,
    question: "Static friction is different from kinetic friction in that it:",
    options: [
      "A. is a friction force between two objects that are moving relative to each other.",
      "B. has higher value in smooth surfaces than in rough surfaces.",
      "C. is a friction force between two objects that are at rest relative to each other.",
      "D. has a maximum value which is often lower than kinetic friction."
    ],
    answer: 0,
    explanation: "Kinetic friction acts when objects are moving relative to each other. Static friction acts before relative motion begins."
  },

  {
    number: 16,
    question: "Which statement is correct about simple machines?",
    options: [
      "A. A machine whose mechanical advantage is less than 1 is called a force multiplier.",
      "B. When a machine's velocity ratio is less than 1, it is called a speed multiplier.",
      "C. A machine can be designed to be a force multiplier, a speed multiplier, and a direction changer at the same time.",
      "D. When a machine's velocity ratio is greater than 1, it is called a speed multiplier."
    ],
    answer: 1,
    explanation: "A velocity ratio less than 1 means the output moves faster than the effort, so the machine is a speed multiplier."
  },

  {
    number: 17,
    question: "A forklift truck applied a force of 30 N and dragged an object through 200 m in 5 minutes. What is the average power output?",
    options: [
      "A. 20 W",
      "B. 200 W",
      "C. 1800 W",
      "D. 1200 W"
    ],
    answer: 0,
    explanation: "Power = Work / time = (Force × distance) / time = (30 × 200) / 300 = 20 W."
  },

  {
    number: 18,
    question: "The velocity-time graph is shown in the exam. What is the total displacement during the whole period of motion?",
    options: [
      "A. 14 m",
      "B. 8 m",
      "C. 10 m",
      "D. 12 m"
    ],
    answer: 2,
    explanation: "Displacement is the area under a velocity-time graph. Adding the positive areas and subtracting the negative area gives 10 m."
  },

  {
    number: 19,
    question: "Which statement correctly defines a characteristic feature of mechanical waves?",
    options: [
      "A. The number of complete waves passing a point per second is called time period.",
      "B. The distance between two adjacent peaks of the wave is called amplitude.",
      "C. The distance that the wave travels in one second is called frequency.",
      "D. The minimum distance between two identical points on adjacent waves is called wavelength."
    ],
    answer: 3,
    explanation: "Wavelength is the minimum distance between two identical points on consecutive waves, such as crest to crest."
  },

  {
    number: 20,
    question: "The speed of sound is greatest in which material?",
    options: [
      "A. Water",
      "B. Copper",
      "C. Oil",
      "D. Air"
    ],
    answer: 1,
    explanation: "Sound generally travels faster in solids. Copper is a solid, so sound travels fastest in copper among these options."
  },

  {
    number: 21,
    question: "Which statement correctly describes the graphical representation of a vector?",
    options: [
      "A. It is represented by an arrow whose length represents the magnitude of the vector according to a suitable scale.",
      "B. It is represented by an arrow in which the length of the arrow is equal to the magnitude of the vector.",
      "C. It is represented algebraically by a line showing only the magnitude of the vector.",
      "D. It is represented by a bold letter or an arrow over a letter."
    ],
    answer: 0,
    explanation: "Graphically, a vector is shown by an arrow. Its length represents magnitude using a chosen scale, and its direction shows direction."
  },

  {
    number: 22,
    question: "A first-class lever lifts a 500 N load by applying an effort of 500 N. The load arm is 2 m and the effort arm is 5 m. What is the velocity ratio?",
    options: [
      "A. 0.40",
      "B. 0.60",
      "C. 2.50",
      "D. 1.67"
    ],
    answer: 2,
    explanation: "Velocity ratio = effort arm / load arm = 5 / 2 = 2.5."
  },

  {
    number: 23,
    question: "A car moves at 80 km/h for 1 hour to the East and then at 60 km/h for 2 hours to the West. What is its average velocity?",
    options: [
      "A. 66.7 km/h West",
      "B. 13.3 km/h West",
      "C. 66.7 km/h East",
      "D. 13.3 km/h East"
    ],
    answer: 1,
    explanation: "Displacement = 80 km East − 120 km West = 40 km West. Total time = 3 h. Average velocity = 40/3 = 13.3 km/h West."
  },

  {
    number: 24,
    question: "Three velocity vectors are drawn using a scale of 1 cm to 10 m/s. What is the resultant velocity?",
    options: [
      "A. 20√2 m/s at 45° from the positive x-axis",
      "B. 10√41 m/s at 45° from the positive x-axis",
      "C. 10 m/s to the negative y-axis",
      "D. 50 m/s to the negative y-axis"
    ],
    answer: 3,
    explanation: "The vector components add to 5 cm downward. Using the scale, 5 cm = 50 m/s in the negative y-direction."
  },

  {
    number: 25,
    question: "Pascal's principle states that pressure added at the top of a liquid at rest in a cylindrical container:",
    options: [
      "A. increases pressure at any point by a greater amount than added at the top.",
      "B. increases pressure at any point by the same amount as added at the top.",
      "C. decreases pressure at any point by the same amount as added at the top.",
      "D. increases pressure at any point by a smaller amount than added at the top."
    ],
    answer: 1,
    explanation: "Pascal's principle says that pressure applied to an enclosed fluid is transmitted equally in all directions."
  },

  {
    number: 26,
    question: "A high-pressure system can be applied to:",
    options: [
      "A. reduce the gas in bicycle and car tires.",
      "B. biological samples to increase microorganism activity.",
      "C. transport a fluid through a pipe.",
      "D. generate cold water from steam or super-heated water."
    ],
    answer: 2,
    explanation: "A high-pressure system is used to push or transport fluids through pipes."
  },

  {
    number: 27,
    question: "Which statement is correct about steady and turbulent fluid flow?",
    options: [
      "A. In steady flow, adjacent layers of fluid do not cross each other unlike in turbulent flow.",
      "B. In each flow, the lines along which fluid particles move do not cross each other.",
      "C. In each flow, fluid particles pass a given point with the same velocity.",
      "D. In turbulent flow, the velocity of fluid particles is the same at the same point unlike in steady flow."
    ],
    answer: 0,
    explanation: "In steady or streamline flow, adjacent fluid layers move smoothly without crossing each other."
  },

  {
    number: 28,
    question: "Earth has an orbital period of 365 days. If another planet has a mean distance from the Sun of R = 4RE, what is its orbital period?",
    options: [
      "A. 1460 days",
      "B. 730 days",
      "C. 23360 days",
      "D. 2920 days"
    ],
    answer: 3,
    explanation: "Kepler's third law: T² is proportional to R³. Therefore, T = 365 × 4^(3/2) = 365 × 8 = 2920 days."
  }
];

let currentIndex = 0;
let scoreValue = 0;
let answered = false;

const questionElement = document.getElementById("question");
const optionsElement = document.getElementById("options");
const feedbackElement = document.getElementById("feedback");
const nextButton = document.getElementById("nextButton");
const progressElement = document.getElementById("progress");
const quizBox = document.getElementById("quizBox");
const resultBox = document.getElementById("result");
const scoreElement = document.getElementById("score");
const percentageElement = document.getElementById("percentage");

function loadQuestion() {
  answered = false;
  nextButton.style.display = "none";
  feedbackElement.style.display = "none";
  feedbackElement.innerHTML = "";

  const currentQuestion = questions[currentIndex];

  progressElement.innerText =
    `Question ${currentQuestion.number} / 28`;

  questionElement.innerText = currentQuestion.question;
  optionsElement.innerHTML = "";

  currentQuestion.options.forEach((option, index) => {
    const button = document.createElement("button");
    button.className = "option";
    button.innerText = option;
    button.onclick = () => selectAnswer(button, index);
    optionsElement.appendChild(button);
  });
}

function selectAnswer(selectedButton, selectedIndex) {
  if (answered) return;

  answered = true;
  const currentQuestion = questions[currentIndex];
  const allButtons = optionsElement.children;

  for (const button of allButtons) {
    button.disabled = true;
  }

  feedbackElement.style.display = "block";

  if (selectedIndex === currentQuestion.answer) {
    selectedButton.classList.add("correct");
    feedbackElement.innerHTML =
      "✅ Correct Answer!<br><small>" +
      currentQuestion.explanation +
      "</small>";
    feedbackElement.style.background = "#e8f5e9";
    feedbackElement.style.color = "#075b23";
    scoreValue++;
  } else {
    selectedButton.classList.add("wrong");
    allButtons[currentQuestion.answer].classList.add("correct");

    feedbackElement.innerHTML =
      "❌ Wrong Answer!<br><small>" +
      currentQuestion.explanation +
      "</small>";
    feedbackElement.style.background = "#ffebee";
    feedbackElement.style.color = "#8b0000";
  }

  nextButton.style.display = "block";
}

function nextQuestion() {
  currentIndex++;

  if (currentIndex < questions.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  quizBox.style.display = "none";
  resultBox.style.display = "block";

  const percentage =
    Math.round((scoreValue / questions.length) * 100);

  scoreElement.innerText =
    `Your score: ${scoreValue} / ${questions.length}`;

  percentageElement.innerText =
    `Percentage: ${percentage}%`;
}

function restartQuiz() {
  currentIndex = 0;
  scoreValue = 0;
  resultBox.style.display = "none";
  quizBox.style.display = "block";
  loadQuestion();
}

loadQuestion();
</script>

</body>
</html>
